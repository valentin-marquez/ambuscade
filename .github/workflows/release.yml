name: Release

# Push a tag v<mod_version>-mc<minecraft_version>, e.g. v0.1.0-mc1.21.1 or v0.1.0-beta.1-mc1.21.1.
# Builds both loaders, creates the GitHub release and publishes both jars to Modrinth.
# Needs secret MODRINTH_TOKEN and variable MODRINTH_PROJECT_ID. Safe to re-run.

on:
  push:
    tags: ["v*-mc*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.4

      - name: Read tag
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"; version="${version%-mc*}"
          mc="${tag##*-mc}"
          prop() { grep "^$1" gradle.properties | cut -d= -f2 | tr -d ' '; }
          mod_version="$(prop mod_version)"
          if [ "${version%%-*}" != "$mod_version" ] || [ "$mc" != "$(prop minecraft_version)" ]; then
            echo "::error::tag $tag does not match gradle.properties (mod_version=$mod_version, minecraft_version=$(prop minecraft_version))"
            exit 1
          fi
          case "$version" in
            *-alpha*) type=alpha ;;
            *-beta*) type=beta ;;
            *) type=release ;;
          esac
          # changelog: the "## <version>" section, falling back to "## <mod_version>"
          section() { awk -v v="## $1" '$0 == v {f=1; next} /^## / {f=0} f' CHANGELOG.md; }
          section "$version" > notes.md
          [ -s notes.md ] || section "$mod_version" > notes.md
          [ -n "$(tr -d '[:space:]' < notes.md)" ] || { echo "::error::no '## $version' section in CHANGELOG.md"; exit 1; }
          { echo "VERSION=$version"; echo "MOD_VERSION=$mod_version"; echo "MC=$mc"; echo "TYPE=$type"; } >> "$GITHUB_ENV"

      - name: Build
        run: ./gradlew build --no-daemon

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && { echo "release exists"; exit 0; }
          prerelease=""; [ "$TYPE" = release ] || prerelease="--prerelease"
          gh release create "$GITHUB_REF_NAME" $prerelease --title "Ambuscade $VERSION for Minecraft $MC" --notes-file notes.md \
            "fabric/build/libs/ambuscade-fabric-$MOD_VERSION.jar" \
            "neoforge/build/libs/ambuscade-neoforge-$MOD_VERSION.jar"

      - name: Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          PROJECT: ${{ vars.MODRINTH_PROJECT_ID }}
        run: |
          api=https://api.modrinth.com/v2
          ua="valentin-marquez/ambuscade release workflow"
          project_id="$(curl -fsS -A "$ua" "$api/project/$PROJECT" | jq -r .id)"
          dep() { curl -fsS -A "$ua" "$api/project/$1" | jq '{project_id: .id, dependency_type: "required"}'; }
          geckolib="$(dep geckolib)"; architectury="$(dep architectury-api)"; fabric_api="$(dep fabric-api)"

          publish() {  # loader, display name, dependencies json array
            number="$VERSION+mc$MC-$1"
            if curl -fsS -A "$ua" "$api/project/$project_id/version" | jq -e --arg n "$number" 'any(.[]; .version_number == $n)' > /dev/null; then
              echo "$number already on Modrinth"; return
            fi
            jq -n --arg name "Ambuscade $VERSION ($2)" --arg number "$number" --rawfile changelog notes.md \
              --arg mc "$MC" --arg type "$TYPE" --arg loader "$1" --arg project "$project_id" --argjson deps "$3" \
              '{name: $name, version_number: $number, changelog: $changelog, dependencies: $deps,
                game_versions: [$mc], version_type: $type, loaders: [$loader], featured: true,
                status: "listed", project_id: $project, file_parts: ["file"], primary_file: "file"}' > data.json
            curl -sS --fail-with-body -A "$ua" -H "Authorization: $MODRINTH_TOKEN" "$api/version" \
              -F "data=<data.json;type=application/json" \
              -F "file=@$1/build/libs/ambuscade-$1-$MOD_VERSION.jar;type=application/java-archive" | jq -r '"published \(.version_number) (\(.id))"'
          }
          publish fabric Fabric "[$geckolib, $architectury, $fabric_api]"
          publish neoforge NeoForge "[$geckolib, $architectury]"
