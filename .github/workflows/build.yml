name: Build

on:
  push:
    branches: [main, "mc/**"]
  pull_request:
    branches: [main, "mc/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.4
      - run: ./gradlew build --no-daemon
