plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    runs {
        client {
            property "ambuscade.harness.port", "25586"
            if (project.hasProperty("ambuscade.world")) {
                programArgs "--quickPlaySingleplayer", project.property("ambuscade.world")
            }
            if (project.hasProperty("ambuscade.join")) {   // multiplayer tests: -Pambuscade.join=localhost
                programArgs "--quickPlayMultiplayer", project.property("ambuscade.join"), "--username", "Alice"
            }
        }
        client2 {   // the second player for multiplayer tests, with its own folder and harness port
            client()
            runDir "run-client2"
            property "ambuscade.harness.port", "25587"
            programArgs "--quickPlayMultiplayer", "localhost", "--username", "Bob"
        }
        server {
            runDir "run-server"
            programArgs "--nogui"
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    modImplementation "dev.architectury:architectury-neoforge:$rootProject.architectury_api_version"
    modImplementation "maven.modrinth:geckolib:$rootProject.geckolib_neoforge"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionNeoForge')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: inputs.properties.version
    }
}

// merge the common classes/resources into the loader jar, then remap it to intermediary/SRG names
shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
}
