plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    runs {
        client {
            property "ambuscade.harness.port", "25586"
            if (project.hasProperty("ambuscade.world")) {
                programArgs "--quickPlaySingleplayer", project.property("ambuscade.world")
            }
        }
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    implementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    implementation "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    implementation "dev.architectury:architectury-fabric:$rootProject.architectury_api_version"
    implementation "maven.modrinth:geckolib:$rootProject.geckolib_fabric"

    common(project(path: ':common')) { transitive = false }
    shadowBundle project(path: ':common', configuration: 'transformProductionFabric')
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand version: inputs.properties.version
    }
}

// merge the common classes/resources into the loader jar (same pattern as vouch)
shadowJar {
    configurations = [project.configurations.shadowBundle]
    dependsOn jar
    mainSpec.sourcePaths.clear()
    from(zipTree(jar.archiveFile))
    archiveClassifier = null
}

jar {
    archiveClassifier = 'raw'
}

assemble.dependsOn shadowJar
