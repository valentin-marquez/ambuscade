pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}

if (JavaVersion.current().ordinal() + 1 < 21) {
    throw new IllegalStateException('Ambuscade for 1.21.1 builds on Java 21+. Run gradle with -Dorg.gradle.java.home=<JDK 21>.')
}

rootProject.name = 'ambuscade'

include 'common'
include 'fabric'
include 'neoforge'
