pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.architectury.dev/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
        gradlePluginPortal()
    }
}

if (JavaVersion.current().ordinal() + 1 < 25) {
    throw new IllegalStateException('Ambuscade builds on Java 25+ (Minecraft 26.x). Run gradle with -Dorg.gradle.java.home=<JDK 25>.')
}

rootProject.name = 'ambuscade'

include 'common'
include 'fabric'
include 'neoforge'
