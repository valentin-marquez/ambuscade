architectury {
    common rootProject.enabled_platforms.split(',')
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:$rootProject.fabric_loader_version"
    modImplementation "dev.architectury:architectury:$rootProject.architectury_api_version"
    // only so Loom remaps the GeckoLib jar below with a complete classpath: its client reload listener implements a
    // Fabric API interface, and without it the remapped copy (shared with the fabric run) keeps an intermediary
    // method name and the client dies with an AbstractMethodError. Never import net.fabricmc.fabric.api here.
    modCompileOnly "net.fabricmc.fabric-api:fabric-api:$rootProject.fabric_api_version"
    // common code compiles against the fabric GeckoLib jar; its API is loader-neutral
    modCompileOnly "maven.modrinth:geckolib:$rootProject.geckolib_fabric"
}

dependencies {
    testImplementation platform("org.junit:junit-bom:5.10.2")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

test {
    useJUnitPlatform()
}

// the dev harness stays out of git and out of release jars; pass -Pambuscade.harness to build it in
if (project.hasProperty("ambuscade.harness") && file("src/harness").exists()) {
    sourceSets.main.java.srcDir "src/harness/java"
    sourceSets.test.java.srcDir "src/harness/test"
}
